services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documindpassword
      POSTGRES_DB: documind_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U documind -d documind_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: